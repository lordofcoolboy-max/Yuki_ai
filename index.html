
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUKI AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --purple: #a855f7;
  --blue: #38bdf8;
  --cyan: #2dd4bf;
  --pink: #f472b6;
}

body {
  min-height: 100dvh;
  background:
    radial-gradient(ellipse at 5% 5%, #55218c 0%, transparent 38%),
    radial-gradient(ellipse at 95% 10%, #075985 0%, transparent 38%),
    radial-gradient(ellipse at 10% 95%, #075e58 0%, transparent 35%),
    radial-gradient(ellipse at 95% 95%, #831843 0%, transparent 35%),
    #070914;
  color: #f8fafc;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  border-bottom: 1px solid #ffffff20;
  background: #ffffff08;
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 23px;
  background: linear-gradient(135deg, var(--purple), var(--blue), var(--cyan), var(--pink));
  box-shadow: 0 0 22px #a855f788;
}

.brand h2 {
  font-size: 20px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #d8b4fe, #67e8f9, #f9a8d4);
  color: transparent;
  background-clip: text;
}

.brand small {
  display: block;
  font-size: 10px;
  color: #a5b4fc;
  margin-top: 3px;
  letter-spacing: 2px;
}

.header-actions {
  display: flex;
  gap: 7px;
}

.top-btn {
  border: 1px solid #ffffff25;
  background: #ffffff10;
  color: white;
  padding: 9px 11px;
  border-radius: 12px;
  font-size: 11px;
  cursor: pointer;
}

.top-btn:active, .send:active, .mic:active {
  transform: scale(.94);
}

#voiceToggle {
  border-color: #2dd4bf88;
  color: #5eead4;
}

main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 22px 14px;
  scroll-behavior: smooth;
}

.welcome {
  text-align: center;
  padding: 35px 10px 22px;
}

.orb {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  margin: 0 auto 22px;
  display: grid;
  place-items: center;
  font-size: 53px;
  background: radial-gradient(circle at 30% 25%, #ffffff, #a855f7 23%, #2563eb 55%, #0f172a 78%);
  box-shadow: 0 0 25px #a855f7aa, 0 0 65px #38bdf855, inset 0 0 25px #ffffff55;
  animation: float 3s ease-in-out infinite, glow 4s ease-in-out infinite alternate;
}

@keyframes float {
  50% { transform: translateY(-10px); }
}

@keyframes glow {
  from { box-shadow: 0 0 25px #a855f7aa, 0 0 55px #38bdf855; }
  to { box-shadow: 0 0 35px #f472b6aa, 0 0 75px #2dd4bf88; }
}

.welcome h1 {
  font-size: 29px;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #c084fc, #67e8f9, #f9a8d4);
  color: transparent;
  background-clip: text;
}

.welcome p {
  color: #b8c2d9;
  font-size: 13px;
  line-height: 1.7;
}

.status {
  margin-top: 14px;
  color: #5eead4;
  font-size: 11px;
  letter-spacing: 2px;
}

.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 440px;
  margin: 15px auto;
}

.suggestion {
  background: #ffffff0c;
  border: 1px solid #ffffff20;
  color: #e0e7ff;
  border-radius: 15px;
  padding: 13px 8px;
  font-size: 12px;
  cursor: pointer;
}

.suggestion:hover {
  border-color: var(--cyan);
  background: #2dd4bf18;
}

#chat {
  max-width: 700px;
  margin: auto;
}

.message {
  padding: 13px 15px;
  margin: 13px 0;
  max-width: 85%;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  margin-left: auto;
  background: linear-gradient(135deg, #7c3aed, #2563eb);
  border-bottom-right-radius: 5px;
}

.bot {
  margin-right: auto;
  background: #ffffff12;
  border: 1px solid #ffffff20;
  border-bottom-left-radius: 5px;
  backdrop-filter: blur(15px);
}

.typing {
  color: #67e8f9;
  font-size: 12px;
  margin: 10px;
}

footer {
  padding: 12px 12px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid #ffffff20;
  background: #080d1dcc;
  backdrop-filter: blur(20px);
}

.input-area {
  max-width: 700px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 19px;
  background: #ffffff10;
  border: 1px solid #ffffff25;
  box-shadow: 0 0 25px #38bdf822;
}

#userInput {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 14px;
  padding: 10px 5px;
}

#userInput::placeholder {
  color: #94a3b8;
}

.mic, .send {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  border: none;
  border-radius: 14px;
  color: white;
  font-size: 19px;
  cursor: pointer;
  background: linear-gradient(135deg, #a855f7, #2563eb);
}

.send {
  background: linear-gradient(135deg, #0891b2, #0d9488);
}

.mic.listening {
  background: linear-gradient(135deg, #ec4899, #9333ea);
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% { box-shadow: 0 0 0 9px #ec489944; }
}

.note {
  text-align: center;
  color: #64748b;
  font-size: 10px;
  margin-top: 9px;
}

@media (max-width: 380px) {
  .top-btn { padding: 8px 7px; font-size: 10px; }
  .brand h2 { font-size: 17px; }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">✦</div>
    <div>
      <h2>YUKI AI</h2>
      <small>YOUR AI COMPANION</small>
    </div>
  </div>

  <div class="header-actions">
    <button class="top-btn" onclick="newChat()">＋ New</button>
    <button class="top-btn" onclick="showHistory()">▤ History</button>
    <button class="top-btn" id="voiceToggle" onclick="toggleSpeech()">🔊 ON</button>
  </div>
</header>

<main id="main">
  <section class="welcome" id="welcome">
    <div class="orb">✦</div>
    <h1>Hello, I'm YUKI</h1>
    <p>Your intelligent AI assistant.<br>Ask anything. Let's explore together.</p>
    <div class="status" id="statusText">● SYSTEM ONLINE</div>
  </section>

  <div class="suggestions" id="suggestions">
    <button class="suggestion" onclick="quickAsk('Teach me English')">📚 Learn English</button>
    <button class="suggestion" onclick="quickAsk('Tell me a fun fact')">💡 Fun facts</button>
    <button class="suggestion" onclick="quickAsk('Explain artificial intelligence')">🤖 About AI</button>
    <button class="suggestion" onclick="quickAsk('Tell me a short story')">📖 Story time</button>
  </div>

  <div id="chat"></div>
</main>

<footer>
  <div class="input-area">
    <button class="mic" id="micBtn" onclick="startVoice()" title="Voice input">🎙️</button>
    <input id="userInput" placeholder="Message YUKI..." autocomplete="off">
    <button class="send" onclick="sendMessage()" title="Send">➤</button>
  </div>
  <div class="note">YUKI AI • Powered by AI</div>
</footer>

<script>
let yukiHistory = JSON.parse(localStorage.getItem("yukiHistory") || "[]");
let archivedChats = JSON.parse(localStorage.getItem("yukiArchivedChats") || "[]");
let speechEnabled = true;
let busy = false;
let recognition = null;

const chat = document.getElementById("chat");
const main = document.getElementById("main");
const input = document.getElementById("userInput");

function saveHistory() {
  localStorage.setItem("yukiHistory", JSON.stringify(yukiHistory));
}

function addMessage(text, type) {
  document.getElementById("welcome").style.display = "none";
  document.getElementById("suggestions").style.display = "none";

  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  main.scrollTop = main.scrollHeight;
  return div;
}

function toggleSpeech() {
  speechEnabled = !speechEnabled;

  const button = document.getElementById("voiceToggle");
  button.textContent = speechEnabled ? "🔊 ON" : "🔇 OFF";
  button.style.color = speechEnabled ? "#5eead4" : "#fda4af";

  if (!speechEnabled && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  document.getElementById("statusText").textContent =
    speechEnabled ? "● VOICE ENABLED" : "● VOICE DISABLED";
}

function speakReply(text) {
  if (!speechEnabled || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "ta-IN";
  speech.rate = 1;
  speech.pitch = 1;
  speechSynthesis.speak(speech);
}

async function sendMessage() {
  const message = input.value.trim();
  if (!message || busy) return;

  busy = true;
  input.value = "";
  addMessage(message, "user");

  const typing = addMessage("YUKI is thinking...", "bot");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: message,
        history: yukiHistory.slice(-10)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI service unavailable");
    }

    if (!data.reply) {
      throw new Error("No reply received from AI");
    }

    typing.textContent = data.reply;

    yukiHistory.push(
      { role: "user", content: message },
      { role: "assistant", content: data.reply }
    );

    yukiHistory = yukiHistory.slice(-20);
    saveHistory();
    speakReply(data.reply);

  } catch (error) {
    typing.textContent = "Sorry! " + error.message;
  } finally {
    busy = false;
    main.scrollTop = main.scrollHeight;
  }
}

function quickAsk(message) {
  input.value = message;
  sendMessage();
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser. Try Chrome.");
    return;
  }

  if (recognition) {
    recognition.stop();
    recognition = null;
    document.getElementById("micBtn").classList.remove("listening");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "ta-IN";
  recognition.interimResults = false;

  recognition.onstart = () => {
    document.getElementById("micBtn").classList.add("listening");
  };

  recognition.onresult = (event) => {
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    document.getElementById("micBtn").classList.remove("listening");
    recognition = null;
  };

  recognition.onend = () => {
    document.getElementById("micBtn").classList.remove("listening");
    recognition = null;
  };

  recognition.start();
}

function newChat() {
  if (yukiHistory.length > 0) {
    archivedChats.push({
      date: new Date().toLocaleString(),
      messages: yukiHistory
    });

    localStorage.setItem(
      "yukiArchivedChats",
      JSON.stringify(archivedChats)
    );
  }

  yukiHistory = [];
  saveHistory();
  chat.innerHTML = "";
  document.getElementById("welcome").style.display = "block";
  document.getElementById("suggestions").style.display = "grid";
}

function showHistory() {
  if (!archivedChats.length) {
    alert("No previous chats found.");
    return;
  }

  const choice = prompt(
    archivedChats.map((item, index) =>
      (index + 1) + ". " + item.date
    ).join("\n") + "\n\nEnter chat number:"
  );

  const index = Number(choice) - 1;
  if (!Number.isInteger(index) || index < 0 || index >= archivedChats.length) {
    return;
  }

  chat.innerHTML = "";
  document.getElementById("welcome").style.display = "none";
  document.getElementById("suggestions").style.display = "none";

  archivedChats[index].messages.forEach(message => {
    addMessage(
      message.content,
      message.role === "user" ? "user" : "bot"
    );
  });
}

function restoreChat() {
  if (!yukiHistory.length) return;

  document.getElementById("welcome").style.display = "none";
  document.getElementById("suggestions").style.display = "none";

  yukiHistory.forEach(message => {
    addMessage(
      message.content,
      message.role === "user" ? "user" : "bot"
    );
  });
}

restoreChat();
</script>

</body>
</html>
