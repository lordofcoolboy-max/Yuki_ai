<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUKI AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10111b;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 18px;
  text-align: center;
  background: #191b2b;
  border-bottom: 1px solid #303248;
}

header h2 {
  margin: 0;
  color: #9b8cff;
}

header p {
  margin: 6px 0 0;
  color: #aaa;
  font-size: 13px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.message {
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #6655d9;
  margin-left: auto;
}

.bot {
  background: #25283b;
  margin-right: auto;
}

#status {
  color: #aaa;
  padding: 5px 15px;
  font-size: 12px;
}

footer {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #191b2b;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #41445e;
  border-radius: 25px;
  background: #25283b;
  color: white;
  outline: none;
}

button {
  border: 0;
  border-radius: 25px;
  padding: 0 18px;
  background: #7965ef;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h2>✨ YUKI AI</h2>
  <p>Your Personal AI Assistant</p>
  <button id="newChat" onclick="newChat()">+ New Chat</button>
  <button id="historyBtn" onclick="showHistory()">📚 Chat History</button>
</header>

<div id="chat">
  <div class="message bot">
    Hi! I'm YUKI AI. How can I help you?
  </div>
</div>

<div id="status">Ready</div>

<footer>
  <input id="message" placeholder="Ask YUKI anything..." />
  <button onclick="startVoice()">🎤</button>
  <button id="send" onclick="sendMessage()">Send</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
async function sendMessage() {
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  sendButton.disabled = true;
  statusText.textContent = "YUKI is thinking...";

  const history = JSON.parse(
    localStorage.getItem("yukiHistory") || "[]"
  );

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        history: history.slice(-10)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed");
    }

    const reply = data.reply || "No reply received.";

    history.push(
      { role: "user", content: message },
      { role: "assistant", content: reply }
    );

    localStorage.setItem(
      "yukiHistory",
      JSON.stringify(history.slice(-10))
    );

    addMessage(reply, "bot");
    speakReply(reply);
    statusText.textContent = "Ready";

  } catch (error) {
    addMessage("Sorry! " + error.message, "bot");
    statusText.textContent = "Connection error";
  }

  sendButton.disabled = false;
}


input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});
  
  function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice recognition is not supported in this browser. Try Chrome.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ta-IN";
  recognition.interimResults = false;

  statusText.textContent = "Listening...";

  recognition.onresult = function(event) {
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = function() {
    statusText.textContent = "Voice error. Try again.";
  };

  recognition.onend = function() {
    if (statusText.textContent === "Listening...") {
      statusText.textContent = "Ready";
    }
  };

  recognition.start();
}

function speakReply(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "ta-IN";
  window.speechSynthesis.speak(speech);
}
  window.addEventListener("load", function () {
  const history = JSON.parse(
    localStorage.getItem("yukiHistory") || "[]"
  );

  history.forEach(function (item) {
    if (
      item &&
      ["user", "assistant"].includes(item.role) &&
      typeof item.content === "string"
    ) {
      addMessage(
        item.content,
        item.role === "user" ? "user" : "bot"
      );
    }
  });
});

  function newChat() {
  const confirmNew = confirm("Start a new chat?");
  if (!confirmNew) return;

  const history = JSON.parse(localStorage.getItem("yukiHistory") || "[]");

  if (history.length > 0) {
    const chats = JSON.parse(localStorage.getItem("yukiArchivedChats") || "[]");

    chats.push({
      date: new Date().toLocaleString(),
      messages: history
    });

    localStorage.setItem("yukiArchivedChats", JSON.stringify(chats));
  }

  localStorage.removeItem("yukiHistory");
  chat.innerHTML = "";
  addMessage("Hello! I'm YUKI AI. How can I help you?", "bot");
  statusText.textContent = "Ready";
}
  function showHistory() {
  const chats = JSON.parse(
    localStorage.getItem("yukiArchivedChats") || "[]"
  );

  if (chats.length === 0) {
    alert("No old chats found!");
    return;
  }

  const options = chats.map((item, index) =>
    `${index + 1}. ${item.date}`
  ).join("\n");

  const choice = prompt(
    "Choose a chat number:\n" + options
  );

  const number = Number(choice);

  if (!Number.isInteger(number) || number < 1 || number > chats.length) {
    return;
  }

  chat.innerHTML = "";

  chats[number - 1].messages.forEach(item => {
    addMessage(
      item.content,
      item.role === "user" ? "user" : "bot"
    );
  });

  statusText.textContent = "Viewing old chat";
  }
</script>

</body>
</html>
