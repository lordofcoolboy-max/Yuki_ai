
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUKI AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #292052, #0a0b16 55%);
  color: #fff;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}

header {
  padding: 20px 12px 15px;
  text-align: center;
  background: rgba(22, 19, 43, 0.85);
  border-bottom: 1px solid #51447d;
  box-shadow: 0 5px 25px #0006;
}

header h2 {
  margin: 0;
  font-size: 28px;
  letter-spacing: 2px;
  color: #c3a8ff;
  text-shadow: 0 0 18px #9470ff;
}

header p {
  margin: 7px 0 14px;
  font-size: 13px;
  color: #c4bddb;
}

header button {
  margin: 4px;
  padding: 10px 15px;
  border-radius: 22px;
  border: 1px solid #7460a9;
  background: #292343;
  color: white;
  font-weight: bold;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px 14px;
  scroll-behavior: smooth;
}

.message {
  padding: 14px 17px;
  margin: 13px 0;
  max-width: 86%;
  border-radius: 19px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  box-shadow: 0 5px 18px #0004;
}

.user {
  margin-left: auto;
  background: linear-gradient(135deg, #a477ff, #6544d6);
  border: 1px solid #b69aff;
  border-bottom-right-radius: 5px;
}

.bot {
  margin-right: auto;
  background: rgba(35, 32, 58, 0.95);
  border: 1px solid #514674;
  border-bottom-left-radius: 5px;
}

#status {
  padding: 8px 16px;
  color: #c3a8ff;
  font-size: 12px;
  background: rgba(15, 13, 30, 0.8);
}

footer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px;
  background: rgba(22, 19, 43, 0.96);
  border-top: 1px solid #51447d;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 25px;
  border: 1px solid #66558f;
  background: #211d38;
  color: white;
  outline: none;
  font-size: 14px;
}

input::placeholder {
  color: #aaa0c4;
}

input:focus {
  border-color: #bd9aff;
  box-shadow: 0 0 12px #8960d866;
}

button {
  cursor: pointer;
  transition: 0.2s;
}

button:active {
  transform: scale(0.94);
}

footer button {
  border: 0;
  border-radius: 24px;
  padding: 13px 16px;
  color: white;
  font-weight: bold;
  background: linear-gradient(135deg, #a477ff, #6844d6);
  box-shadow: 0 3px 15px #8056e955;
}

footer button:disabled {
  opacity: 0.5;
}

@media (max-width: 480px) {
  header {
    padding: 16px 8px;
  }

  header h2 {
    font-size: 25px;
  }

  #chat {
    padding: 12px;
  }

  .message {
    max-width: 91%;
  }

  footer {
    padding: 10px;
    gap: 6px;
  }

  footer button {
    padding: 13px 12px;
  }
}
</style>
</head>

<body>

<header>
  <h2>✨ YUKI AI</h2>
  <p>Your Personal AI Assistant</p>
  <button id="newChat" onclick="newChat()">＋ New Chat</button>
  <button id="historyBtn" onclick="showHistory()">📚 History</button>
</header>

<div id="chat">
  <div class="message bot">
    Hi! I'm YUKI AI. How can I help you?
  </div>
</div>

<div id="status">Ready</div>

<footer>
  <input id="message" placeholder="Ask YUKI anything..." />
  <button onclick="startVoice()">🎤</button>
  <button id="send" onclick="sendMessage()">➤</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  sendButton.disabled = true;
  statusText.textContent = "YUKI is thinking...";

  const history = JSON.parse(
    localStorage.getItem("yukiHistory") || "[]"
  );

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        history: history.slice(-10)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed");
    }

    const reply = data.reply || "No reply received.";

    history.push(
      { role: "user", content: message },
      { role: "assistant", content: reply }
    );

    localStorage.setItem(
      "yukiHistory",
      JSON.stringify(history.slice(-10))
    );

    addMessage(reply, "bot");
    speakReply(reply);
    statusText.textContent = "Ready";

  } catch (error) {
    addMessage("Sorry! " + error.message, "bot");
    statusText.textContent = "Connection error";
  }

  sendButton.disabled = false;
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice recognition is not supported. Try Chrome.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ta-IN";
  recognition.interimResults = false;

  statusText.textContent = "Listening...";

  recognition.onresult = function(event) {
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = function() {
    statusText.textContent = "Voice error. Try again.";
  };

  recognition.onend = function() {
    if (statusText.textContent === "Listening...") {
      statusText.textContent = "Ready";
    }
  };

  recognition.start();
}

function speakReply(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "ta-IN";
  window.speechSynthesis.speak(speech);
}

window.addEventListener("load", function() {
  const history = JSON.parse(
    localStorage.getItem("yukiHistory") || "[]"
  );

  if (history.length > 0) {
    chat.innerHTML = "";

    history.forEach(function(item) {
      if (
        item &&
        ["user", "assistant"].includes(item.role) &&
        typeof item.content === "string"
      ) {
        addMessage(
          item.content,
          item.role === "user" ? "user" : "bot"
        );
      }
    });
  }
});

function newChat() {
  const confirmNew = confirm("Start a new chat?");
  if (!confirmNew) return;

  const history = JSON.parse(
    localStorage.getItem("yukiHistory") || "[]"
  );

  if (history.length > 0) {
    const chats = JSON.parse(
      localStorage.getItem("yukiArchivedChats") || "[]"
    );

    chats.push({
      date: new Date().toLocaleString(),
      messages: history
    });

    localStorage.setItem(
      "yukiArchivedChats",
      JSON.stringify(chats)
    );
  }

  localStorage.removeItem("yukiHistory");
  chat.innerHTML = "";

  addMessage("Hello! I'm YUKI AI. How can I help you?", "bot");
  statusText.textContent = "Ready";
}

function showHistory() {
  const chats = JSON.parse(
    localStorage.getItem("yukiArchivedChats") || "[]"
  );

  if (chats.length === 0) {
    alert("No old chats found!");
    return;
  }

  const options = chats.map((item, index) =>
    `${index + 1}. ${item.date}`
  ).join("\n");

  const choice = prompt(
    "Choose a chat number:\n" + options
  );

  const number = Number(choice);

  if (
    !Number.isInteger(number) ||
    number < 1 ||
    number > chats.length
  ) {
    return;
  }

  chat.innerHTML = "";

  chats[number - 1].messages.forEach(item => {
    addMessage(
      item.content,
      item.role === "user" ? "user" : "bot"
    );
  });

  statusText.textContent = "Viewing old chat";
}
</script>

</body>
</html>
